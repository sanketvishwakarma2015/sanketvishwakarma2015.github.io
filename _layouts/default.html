<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="cursor-spotlight" id="cursorSpotlight"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <nav class="navbar">
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="logo">
                <span class="logo-bracket">&lt;</span>SV<span class="logo-bracket">/&gt;</span>
            </a>
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
                <a href="{{ '/about/' | relative_url }}" class="nav-link">About</a>
                <a href="{{ '/blog/' | relative_url }}" class="nav-link">Blog</a>
                <a href="{{ '/contact/' | relative_url }}" class="nav-link">Contact</a>
                <a href="{{ '/resume_sanket_vishwakarma.pdf' | relative_url }}?v={{ site.time | date: '%s' }}" class="nav-link" target="_blank">Resume</a>
                <a href="https://www.linkedin.com/in/sanket-vishwakarma-902953109/" class="nav-link" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/sanketvishwakarma2015" class="nav-link" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </nav>

    <main class="content">
        {{ content }}
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer-left">&copy; 2026 Sanket Vishwakarma &mdash; Data Engineer</p>
            <div class="footer-links">
                <a href="{{ '/blog/' | relative_url }}">Blog</a>
                <a href="{{ '/contact/' | relative_url }}">Contact</a>
                <a href="https://github.com/sanketvishwakarma2015" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/in/sanket-vishwakarma-902953109/" target="_blank">LinkedIn</a>
            </div>
        </div>
    </footer>

    <button class="scroll-to-top" id="scrollToTop" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script type="module" src="{{ '/assets/js/hero3d.js' | relative_url }}"></script>
    <script type="module" src="{{ '/assets/js/animations.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/interactions.js' | relative_url }}"></script>
</body>
</html>
